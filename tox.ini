[tox]
skipsdist = true
envlist = py3

[testenv:gilt]
allowlist_externals = *

commands =
   make sync

[testenv:check]
basepython = python3
deps = -r requirements.txt

commands =
   python3 src/check-inventory-sorting.py

[testenv:check-kolla]
basepython = python3
# The detector lives in osism/release; it needs only requests and PyYAML, both
# already pinned here at the same versions. osism/release is checked out as a
# sibling of this repo -- by the job's required-projects under Zuul, and by the
# usual one-directory-per-org layout locally.
deps = -r requirements.txt

commands =
   python3 {toxinidir}/../release/src/check-drift.py --group kolla        --plugin kolla_inventory --base-dir {toxinidir}/..        --remote-fallback --use-raw-get

[testenv:test]
basepython = python3
deps = -r requirements.txt

allowlist_externals = *

pass_env =
    MANAGER_VERSION

setenv =
   IMAGES_TEMPLATE_PATH = environments/manager/images.yml

commands =
   python3 src/render-images.py
   cat images.yml

[testenv:seed]
basepython = python3
allowlist_externals = *

commands =
   bash src/test-seed.sh
